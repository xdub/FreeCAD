name: Build FreeCAD Ubuntu DEB Packages

on:
  push:
    branches:
      - main
      - build-deb
  workflow_dispatch:

jobs:
  build-deb:
    name: Build DEB on Ubuntu ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-26.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (Ubuntu 24.04)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake cmake-qt-gui git dpkg-dev debhelper libtool checkinstall swig \
            python3-dev python3-pip python3-setuptools python3-yaml python3-matplotlib python3-pivy \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6svg6-dev qt6-l10n-tools qt6-shadertools-dev \
            libocct-modeling-algorithms-dev libocct-visualization-dev libocct-data-exchange-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-ocaf-dev \
            libvtk9-dev libvtk9-qt-dev libmedc-dev pybind11-dev \
            libboost-all-dev libxerces-c-dev libfmt-dev libeigen3-dev libcoin-dev libyaml-cpp-dev \
            libzipios++-dev libjsoncpp-dev nlohmann-json3-dev libsqlite3-dev libssl-dev

          # Instalace PySide6 přes pip (na Pythonu 3.12 v Ubuntu 24.04 jsou balíčky plně dostupné)
          pip3 install --break-system-packages PySide6 shiboken6
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies (Ubuntu 26.04)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake cmake-qt-gui git dpkg-dev debhelper libtool checkinstall swig \
            python3-dev python3-pip python3-setuptools python3-yaml python3-matplotlib pybind11-dev \
            python3-pivy \
            libpyside6-dev libshiboken6-dev \
            python3-pyside6.qtwidgets python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtxml \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6svg6-dev qt6-l10n-tools qt6-shadertools-dev \
            libocct-modeling-algorithms-dev libocct-visualization-dev libocct-data-exchange-dev \
            libocct-foundation-dev libocct-modeling-data-dev libocct-ocaf-dev \
            libvtk9-dev libvtk9-qt-dev libmedc-dev \
            libboost-all-dev libxerces-c-dev libfmt-dev libeigen3-dev libcoin-dev libyaml-cpp-dev \
            libzipios++-dev libjsoncpp-dev nlohmann-json3-dev libsqlite3-dev libssl-dev

      - name: Configure and Compile FreeCAD
        run: |
          # Vypnutí testů natvrdo v CMakeLists, aby se předešlo selhání na Google Test
          sed -i 's/^add_subdirectory(tests)/# add_subdirectory(tests)/' CMakeLists.txt
          
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DFREECAD_USE_QT6=ON \
                -DENABLE_DEVELOPER_TESTS=OFF \
                -DFREECAD_BUILD_TESTS=OFF ..
          make -j$(nproc)

      - name: Create DEB Package via CheckInstall
        run: |
          cd build
          echo "Custom FreeCAD 1.1.4 package for Ubuntu ${{ matrix.os }}" > description-pak
          sudo checkinstall --pkgname=freecad-custom \
                            --pkgversion=1.1.4 \
                            --pkgrelease=1 \
                            --backup=no \
                            --fstrans=no \
                            --default \
                            --install=no

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freecad-1.1.4-${{ matrix.os }}
          path: build/*.deb
