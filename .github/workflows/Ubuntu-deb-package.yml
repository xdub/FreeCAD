name: Build FreeCAD Ubuntu DEB Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deb:
    name: Build DEB on Ubuntu ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_version: "OFF"
            extra_pkgs: "qtbase5-dev qttools5-dev qttools5-dev-tools qtxmlpatterns5-dev-tools libqt5svg5-dev libqt5webkit5-dev libpyside2-dev python3-pyside2.qtcore python3-pyside2.qtwidgets python3-pyside2.qtgui python3-pyside2.qtxml python3-pivy"
          - os: ubuntu-26.04
            qt_version: "ON"
            extra_pkgs: "qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools libqt6svg6-dev qt6-l10n-tools qt6-shadertools-dev libqt6shadertools6-dev libpyside6-dev shiboken6 python3-pyside6 python3-pivy"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Common Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake cmake-qt-gui git dpkg-dev debhelper libtool checkinstall swig             python3-dev python3-pip python3-setuptools python3-yaml python3-matplotlib             libocct-modeling-algorithms-dev libocct-visualization-dev libocct-data-exchange-dev             libocct-foundation-dev libocct-modeling-data-dev libocct-ocaf-dev             libvtk9-dev libvtk9-qt-dev libmedc-dev             libboost-all-dev libxerces-c-dev libfmt-dev libeigen3-dev libcoin-dev libyaml-cpp-dev             libzipios++-dev libjsoncpp-dev nlohmann-json3-dev libsqlite3-dev libssl-dev

      - name: Install OS Specific Dependencies
        run: |
          sudo apt-get install -y ${{ matrix.extra_pkgs }}

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release                 -DFREECAD_USE_QT6=${{ matrix.qt_version }}                 -DENABLE_DEVELOPER_TESTS=OFF                 -DBUILD_TESTING=OFF                 -DFREECAD_BUILD_TESTS=OFF ..

      - name: Compile FreeCAD
        run: |
          cd build
          make -j$(nproc)

      - name: Create DEB Package via CheckInstall
        run: |
          cd build
          # Předpřipravíme prázdný popis pro bezobslužný checkinstall
          echo "Custom FreeCAD 1.1.4 package for ${{ matrix.os }}" > description-pak
          sudo checkinstall --pkgname=freecad-custom                             --pkgversion=1.1.4                             --pkgrelease=${{ matrix.os }}                             --backup=no                             --fstrans=no                             --default                             --install=no

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freecad-1.1.4-${{ matrix.os }}
          path: build/*.deb